name: Structure check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structure-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Check API551 source/archive model
        run: |
          python3 - <<'PY'
          import json
          import zipfile
          from pathlib import Path

          active = [
              "API551_SOURCE_MANIFEST_CURRENT.json",
              "API551_CONSOLIDATED_POLICIES_and_RULES_CURRENT_2026-06-18.md",
              "API551_UNIVERSAL_FIGURE_LABEL_CLEANUP_AND_PLACEMENT_RULES_CURRENT_2026-06-25.md",
              "API551_FIGURE_REWORK_SOURCE_AND_FRAME_FIT_RULES_CURRENT_2026-07-01.md",
              "TZ_API551_PROJECT_STAGE4_CONSOLIDATED_CURRENT_2026-06-18.md",
              "api551_approved_label_master_v1.csv",
              "TZ_API551_translation_project_RU.md",
              "API 551 2016 (R2024).pdf",
          ]
          archived = [
              "API_551_STAGE2_REFERENCE_FILES_v1.zip",
              "API_551_STAGE3_SOURCE_PACKAGE_v1.zip",
              "api551_control_build_v1.zip",
          ]
          project_docs = [
              "docs/project/API551_NEW_CHAT_START_RU.md",
              "docs/project/API551_STAGE4_HANDOFF_CURRENT.json",
              "docs/API551_PROJECT_QUICK_START_CURRENT.md",
          ]
          required_dirs = [
              "source",
              "workspace/figures",
              "docs",
              "docs/project",
              "archive/source-packages",
              "archive/extracted-reference",
              "scripts",
              ".github/workflows",
          ]
          lfs_pointer_prefix = b"version https://git-lfs.github.com/spec/v1"

          def is_lfs_pointer(data: bytes) -> bool:
              return data.startswith(lfs_pointer_prefix)

          def require_lfs_pointer(path: Path, expected_oid: str, expected_size: int) -> None:
              data = path.read_bytes()
              text = data.decode("utf-8", errors="replace")
              if "version https://git-lfs.github.com/spec/v1" not in text:
                  raise SystemExit(f"{path} is neither usable content nor an LFS pointer")
              if f"oid sha256:{expected_oid}" not in text or f"size {expected_size}" not in text:
                  raise SystemExit(f"{path} LFS pointer does not match expected oid/size")

          def require_binary_or_lfs(path: Path, signature: bytes, expected_oid: str, expected_size: int, label: str) -> None:
              if not path.is_file():
                  raise SystemExit(f"missing {label}: {path}")
              data = path.read_bytes()
              if data.startswith(signature):
                  if path.stat().st_size != expected_size:
                      raise SystemExit(f"{path} size mismatch after LFS smudge")
                  return
              require_lfs_pointer(path, expected_oid, expected_size)

          for dirname in required_dirs:
              if not Path(dirname).is_dir():
                  raise SystemExit(f"missing required folder: {dirname}")

          root_scripts = sorted(p.name for p in Path('.').glob('api551*.ps1'))
          if root_scripts != ["api551_pull.ps1"]:
              raise SystemExit(f"root must contain only api551_pull.ps1, got: {root_scripts}")
          for helper in [
              "scripts/api551_gh_upload_run_log.ps1",
              "scripts/api551_git_pull_from_github.ps1",
              "scripts/api551_git_sync_up.ps1",
              "scripts/api551_git_apply_task.ps1",
          ]:
              if not Path(helper).is_file():
                  raise SystemExit(f"missing helper script: {helper}")

          for doc in project_docs:
              if not Path(doc).is_file():
                  raise SystemExit(f"missing project bootstrap/handoff doc: {doc}")

          source_files = sorted(p.name for p in Path("source").iterdir() if p.is_file())
          if source_files != sorted(active):
              raise SystemExit(f"source/ file set mismatch: {source_files}")
          if list(Path("source").glob("*.zip")):
              raise SystemExit("source/ must not contain ZIP packages")

          manifest = json.loads(Path("source/API551_SOURCE_MANIFEST_CURRENT.json").read_text(encoding="utf-8-sig"))
          folder = manifest["canonical_source_policy"]["primary_source_folder"]
          folder_id = "1uLQQ1XHveKaUzLgULQ84jYUD1GYMWPKX"
          folder_url = f"https://drive.google.com/drive/folders/{folder_id}"
          if folder.get("folder_id") != folder_id or folder.get("url") != folder_url:
              raise SystemExit("manifest Drive source folder mismatch")
          if folder.get("file_count_via_drive_api") != 7:
              raise SystemExit("manifest Drive source file count must be 7")
          if manifest.get("drive_context", {}).get("source_folder_id") != folder_id:
              raise SystemExit("manifest drive_context.source_folder_id mismatch")

          manifest_files = {item["file"] for item in manifest.get("mandatory_sources", [])}
          manifest_files.update(item["file"] for item in manifest.get("supplemental_source_files", []))
          manifest_files.update(item["name"] for item in manifest.get("active_source_working_files", []))
          if manifest_files != set(active):
              raise SystemExit(f"manifest active file set mismatch: {sorted(manifest_files)}")

          archived_records = {item["file"]: item for item in manifest.get("archived_source_packages", [])}
          if set(archived_records) != set(archived):
              raise SystemExit("manifest archived_source_packages mismatch")
          for name in archived:
              path = Path("archive/source-packages") / name
              if not path.is_file():
                  raise SystemExit(f"missing archived package: {path}")
              record = archived_records[name]
              if record.get("archive_path") != str(path):
                  raise SystemExit(f"archive_path mismatch for {name}")
              if "forbidden as generation input" not in record.get("role", ""):
                  raise SystemExit(f"archived package role must forbid generation input: {name}")

          ref = json.loads(Path("archive/extracted-reference/EXTRACTED_REFERENCE_MANIFEST.json").read_text(encoding="utf-8-sig"))
          if ref.get("status") != "archive_reference_index_only_not_generation_input":
              raise SystemExit("wrong extracted reference manifest status")
          if ref.get("extracted_files_created_in_repo") != []:
              raise SystemExit("extracted reference index must not create derived files as repo inputs")
          for item in ref.get("selected_reference_members", []):
              suffix = Path(item.get("source_member", "")).suffix.lower()
              if suffix in {".html", ".png", ".jpg", ".jpeg", ".zip", ".pdf"}:
                  raise SystemExit(f"forbidden reference member selected: {item}")

          text_active = [name for name in active if not name.endswith(".pdf")]
          for name in text_active:
              path = Path("source") / name
              data = path.read_bytes()
              if not data:
                  raise SystemExit(f"{path} is empty")
              if is_lfs_pointer(data):
                  raise SystemExit(f"{path} is a Git LFS pointer, not usable text content")

          require_binary_or_lfs(
              Path("source/API 551 2016 (R2024).pdf"),
              b"%PDF",
              "d458b3a899902f216767e753aa5737a9745b61adcab02f85c9521937a9d3e270",
              8089772,
              "source PDF",
          )

          expected_zip_oid = {
              "API_551_STAGE2_REFERENCE_FILES_v1.zip": "cda3e972a0acc5104e61a538c19f5c301c554eab03abd1bf868474f12babdf70",
              "API_551_STAGE3_SOURCE_PACKAGE_v1.zip": "5a6d1bb1fb099dd5346297855b57758e68b503d84bdb890b0c775650d4fd7643",
              "api551_control_build_v1.zip": "c9a8c330b0b20eb1c7b3f82dbf98eafa3409aec3611ff874419ecb3c5b627cc2",
          }
          for item in manifest.get("archived_source_packages", []):
              path = Path(item["archive_path"])
              data = path.read_bytes()
              if data.startswith(b"PK"):
                  if path.stat().st_size != int(item["local_size"]):
                      raise SystemExit(f"{path} size mismatch after LFS smudge")
                  with zipfile.ZipFile(path) as zf:
                      bad = zf.testzip()
                  if bad is not None:
                      raise SystemExit(f"{path} ZIP integrity failed at {bad}")
                  continue
              require_lfs_pointer(path, expected_zip_oid[item["file"]], int(item["local_size"]))

          readme = Path("README.md").read_text(encoding="utf-8-sig")
          workflow = Path(".github/workflows/structure-check.yml").read_text(encoding="utf-8-sig")
          quickstart = Path("docs/API551_PROJECT_QUICK_START_CURRENT.md").read_text(encoding="utf-8-sig")
          bootstrap = Path("docs/project/API551_NEW_CHAT_START_RU.md").read_text(encoding="utf-8-sig")
          handoff = Path("docs/project/API551_STAGE4_HANDOFF_CURRENT.json").read_text(encoding="utf-8-sig")
          for name in active + archived:
              if name not in readme:
                  raise SystemExit(f"README does not mention {name}")
              if name not in workflow:
                  raise SystemExit(f"workflow does not mention {name}")
          for name in project_docs:
              if name not in readme:
                  raise SystemExit(f"README does not mention project doc {name}")
              if name not in quickstart and name != "docs/API551_PROJECT_QUICK_START_CURRENT.md":
                  raise SystemExit(f"quickstart does not mention project doc {name}")
              if name not in workflow:
                  raise SystemExit(f"workflow does not mention project doc {name}")
          if "docs/project/API551_STAGE4_HANDOFF_CURRENT.json" not in bootstrap:
              raise SystemExit("bootstrap does not point to handoff JSON")
          if "acceptance_update_rule" not in handoff:
              raise SystemExit("handoff JSON must include acceptance_update_rule")
          print("API551 source/archive/bootstrap model OK")
          PY

      - name: Check UTF-8 text encodings
        run: |
          python3 - <<'PY'
          from pathlib import Path

          text_suffixes = {".html", ".json", ".md", ".csv", ".txt", ".ps1", ".yml", ".yaml"}
          excluded_parts = {".git"}
          excluded_prefixes = {"docs/run-logs/"}
          forbidden_boms = {
              b"\xff\xfe": "UTF-16 LE BOM",
              b"\xfe\xff": "UTF-16 BE BOM",
          }
          mojibake_markers = ["╨", "╤", "┬", "┐", "└", "─", "│", "Ð", "Ñ", "Â", "ð", "ñ", "РЎ", "Рњ", "Рё", "�"]
          allowed_marker_paths = {".github/workflows/structure-check.yml"}
          important_files = {"index.html", "catalog.json"}
          important_files.update(p.as_posix() for p in Path("workspace/figures").glob("*/figure_*.html"))
          important_files.update(p.as_posix() for p in Path("workspace/figures").glob("*/figure_*.json"))
          important_files.update({
              "docs/project/API551_NEW_CHAT_START_RU.md",
              "docs/project/API551_STAGE4_HANDOFF_CURRENT.json",
              "docs/API551_PROJECT_QUICK_START_CURRENT.md",
          })

          failures = []
          checked = 0
          for path in sorted(Path(".").rglob("*")):
              if not path.is_file():
                  continue
              rel = path.relative_to(Path("."))
              rel_posix = rel.as_posix()
              if any(part in excluded_parts for part in rel.parts):
                  continue
              if any(rel_posix.startswith(prefix) for prefix in excluded_prefixes):
                  continue
              if path.suffix.lower() not in text_suffixes:
                  continue

              checked += 1
              data = path.read_bytes()
              for bom, label in forbidden_boms.items():
                  if data.startswith(bom):
                      failures.append(f"{rel_posix}: forbidden {label}")
              try:
                  text = data.decode("utf-8-sig", errors="strict")
              except UnicodeDecodeError as exc:
                  failures.append(f"{rel_posix}: invalid UTF-8 at byte {exc.start}")
                  continue

              if "\x00" in text:
                  failures.append(f"{rel_posix}: NUL byte in text file; possible UTF-16/invalid text encoding")

              if rel_posix in important_files and rel_posix not in allowed_marker_paths:
                  found = [marker for marker in mojibake_markers if marker in text]
                  if found:
                      failures.append(f"{rel_posix}: possible mojibake markers found: {found[:8]}")

              if path.suffix.lower() == ".html" and rel_posix in important_files:
                  head = text[:1000].lower()
                  if "<meta charset=\"utf-8\">" not in head and "<meta charset='utf-8'>" not in head:
                      failures.append(f"{rel_posix}: missing <meta charset=\"utf-8\"> near document head")

          if failures:
              raise SystemExit("encoding check failed:\n" + "\n".join(failures[:80]))
          print(f"UTF-8 encoding check OK ({checked} text files; {len(important_files)} mojibake-guarded files)")
          PY

      - name: Validate JSON files
        run: |
          python3 -m json.tool source/API551_SOURCE_MANIFEST_CURRENT.json > /dev/null
          python3 -m json.tool archive/extracted-reference/EXTRACTED_REFERENCE_MANIFEST.json > /dev/null
          python3 -m json.tool catalog.json > /dev/null
          python3 -m json.tool docs/project/API551_STAGE4_HANDOFF_CURRENT.json > /dev/null

      - name: Check catalog Stage 4 status
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          lfs_pointer_prefix = b"version https://git-lfs.github.com/spec/v1"
          png_signature = b"\x89PNG\r\n\x1a\n"

          def require_png_or_lfs_pointer(path: Path, label: str) -> None:
              if not path.is_file():
                  raise SystemExit(f"missing PNG asset for {label}: {path}")
              data = path.read_bytes()
              if data.startswith(png_signature):
                  return
              if data.startswith(lfs_pointer_prefix):
                  text = data.decode("utf-8", errors="replace")
                  if "oid sha256:" not in text or "size " not in text:
                      raise SystemExit(f"invalid LFS pointer for {label}: {path}")
                  return
              raise SystemExit(f"{label} PNG asset is neither real PNG nor LFS pointer: {path}")

          catalog = json.loads(Path("catalog.json").read_text(encoding="utf-8-sig"))
          handoff = json.loads(Path("docs/project/API551_STAGE4_HANDOFF_CURRENT.json").read_text(encoding="utf-8-sig"))
          figures = catalog.get("figures", [])
          if len(figures) != 69:
              raise SystemExit(f"catalog must contain 69 figures, got {len(figures)}")
          accepted_expected = {1, 2, 4, 9, 14, 16, 18, 23, 25, 28, 30, 31, 33, 37, 46, 48, 50, 51, 52, 62, 66}
          accepted = {int(f["figure_no"]) for f in figures if f.get("status") == "accepted"}
          changed = [f for f in figures if str(f.get("status", "")).startswith("измененно_")]
          not_accepted = [f for f in figures if f.get("status") == "not_accepted"]
          if accepted != accepted_expected:
              raise SystemExit(f"accepted figure set mismatch: {sorted(accepted)}")
          if changed:
              raise SystemExit(f"changed/review figures must be empty after Figure 2 acceptance, got {[f.get('figure_no') for f in changed]}")
          if len(not_accepted) != 48:
              raise SystemExit(f"not_accepted count mismatch: {len(not_accepted)}")
          expected_stats = {"total": 69, "accepted": 21, "changed": 0, "not_accepted": 48}
          if catalog.get("stats", {}) != expected_stats:
              raise SystemExit("catalog stats mismatch")

          if handoff.get("working_branch") != "candidates":
              raise SystemExit("handoff working_branch must be candidates")
          if handoff.get("stable_branch") != "main":
              raise SystemExit("handoff stable_branch must be main")
          if handoff.get("figures_total") != expected_stats["total"]:
              raise SystemExit("handoff figures_total mismatch")
          if handoff.get("figures_accepted") != expected_stats["accepted"]:
              raise SystemExit("handoff figures_accepted mismatch")
          if handoff.get("figures_changed") != expected_stats["changed"]:
              raise SystemExit("handoff figures_changed mismatch")
          if handoff.get("figures_not_accepted") != expected_stats["not_accepted"]:
              raise SystemExit("handoff figures_not_accepted mismatch")
          if set(map(int, handoff.get("accepted_figures", []))) != accepted_expected:
              raise SystemExit("handoff accepted_figures mismatch")
          if "acceptance_update_rule" not in handoff:
              raise SystemExit("handoff must include acceptance_update_rule")
          required_acceptance_sync = set(handoff["acceptance_update_rule"].get("required_on_every_acceptance", []))
          for required in ["catalog.json", "index.html", "docs/project/API551_STAGE4_HANDOFF_CURRENT.json"]:
              if required not in required_acceptance_sync:
                  raise SystemExit(f"handoff acceptance_update_rule missing {required}")

          for figure_no in sorted(accepted_expected):
              fig = next((f for f in figures if int(f.get("figure_no")) == figure_no), None)
              if not fig or fig.get("status") != "accepted":
                  raise SystemExit(f"Figure {figure_no} must be accepted")
              for key in ["folder", "html", "json", "png", "source_crop", "out_html"]:
                  if not fig.get(key):
                      raise SystemExit(f"Figure {figure_no} missing catalog key: {key}")
              require_png_or_lfs_pointer(Path(fig["png"]), f"Figure {figure_no}")
              require_png_or_lfs_pointer(Path(fig["source_crop"]), f"Figure {figure_no} source crop")
          print("catalog Stage 4 status and handoff sync OK")
          PY

      - name: Check portable relative review links
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          root_files = [Path("index.html"), Path("catalog.json")]
          figure_html = sorted(Path("workspace/figures").glob("*/figure_*.html"))
          files = root_files + figure_html
          for path in files:
              text = path.read_text(encoding="utf-8-sig", errors="replace")
              if "file:///C:/" in text or "C:/Downloads/" in text:
                  raise SystemExit(f"absolute Windows path is forbidden: {path}")

          catalog = json.loads(Path("catalog.json").read_text(encoding="utf-8-sig"))
          for fig in catalog.get("figures", []):
              link = fig.get("source_pdf_link", "")
              if not link.startswith("source/API%20551%202016%20(R2024).pdf#page="):
                  raise SystemExit(f"bad root PDF link for Figure {fig.get('figure_no')}: {link}")
              for key in ["folder", "html", "json", "png", "source_crop", "out_html"]:
                  value = fig.get(key)
                  if value and value.startswith("figures/"):
                      raise SystemExit(f"non-portable catalog path for Figure {fig.get('figure_no')} {key}: {value}")

          index = Path("index.html").read_text(encoding="utf-8-sig", errors="replace")
          if 'href="figures/' in index:
              raise SystemExit("index.html still points to root figures/")
          if "source/API%20551%202016%20(R2024).pdf#page=" not in index:
              raise SystemExit("index.html has no relative source PDF links")

          for path in figure_html:
              text = path.read_text(encoding="utf-8-sig", errors="replace")
              if "../../../source/API%20551%202016%20(R2024).pdf#page=" not in text:
                  raise SystemExit(f"Figure HTML has no relative source PDF link: {path}")
              for src in re.findall(r"<img[^>]+src=[\"']([^\"']+)[\"']", text, flags=re.I):
                  if src.startswith(("http://", "https://", "data:")):
                      continue
                  image_path = path.parent / src
                  if not image_path.is_file():
                      raise SystemExit(f"broken image reference {src} in {path}")

          fig66_out = Path("workspace/figures/066/figure_066.out.html").read_text(encoding="utf-8-sig", errors="replace")
          fig66_json = Path("workspace/figures/066/figure_066.object.json").read_text(encoding="utf-8-sig", errors="replace")
          for needle in [
              'data-figure-kind="reconstructed_table_with_embedded_drawing"',
              'class="reconstructed-table"',
              '<th colspan="2">Расход газа</th>',
              '<th colspan="2">Расход жидкости</th>',
              '<td>≥4″</td>',
              'figure_066.png',
          ]:
              if needle not in fig66_out:
                  raise SystemExit(f"Figure 66 reconstructed object missing fragment: {needle}")
          if "file:///C:/" in fig66_json or "C:/Downloads/" in fig66_json:
              raise SystemExit("Figure 66 object JSON contains absolute Windows path")
          print("Figure 66 reconstructed table check OK")
          print("portable relative review links OK")
          PY
